<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Be My Valentine</title>
<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg, #ffe6eb, #ffd1dc);
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* Floating Hearts */
.heart {
  position: absolute;
  font-size: 20px;
  animation: floatUp 6s linear infinite;
  opacity: 0.7;
}

@keyframes floatUp {
  0% {
    transform: translateY(100vh) scale(0.5);
    opacity: 0;
  }
  50% { opacity: 1; }
  100% {
    transform: translateY(-10vh) scale(1.2);
    opacity: 0;
  }
}

.container {
  position: relative;
  z-index: 2;
}

h1 {
  font-size: 28px;
  margin-bottom: 20px;
  transition: all 0.3s ease;
}

#pleadingText {
  font-size: 16px;
  color: #ff1744;
  margin-top: 10px;
  min-height: 24px;
  font-weight: bold;
}

.teddy {
  font-size: 80px;
}

.buttons {
  margin-top: 30px;
  position: relative;
  height: 120px;
}

button {
  padding: 12px 28px;
  font-size: 18px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  transition: 0.2s;
  position: absolute;
}

#yesBtn {
  background: #ff4d6d;
  color: white;
  left: 50%;
  transform: translateX(-50%);
}

#yesBtn:hover {
  transform: translateX(-50%) scale(1.1);
}

#noBtn {
  background: #ccc;
  left: 50%;
  top: 60px;
  transform: translateX(-50%);
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>
<body>

<!-- Romantic Background Music -->
<audio id="bgMusic" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
</audio>

<div class="container">
  <div class="teddy">🧸💖</div>
  <h1>Rahma, will you be my Valentine?</h1>
  <p id="pleadingText"></p>
  <div class="buttons">
    <button id="yesBtn">Yes 💕</button>
    <button id="noBtn">No 😢</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const music = document.getElementById("bgMusic");
const pleadingText = document.getElementById("pleadingText");

let noCount = 0;
let yesSize = 18;
let noSize = 18;

const pleadingMessages = [
  "Are you sure? 🥺",
  "Really? But I got you virtual flowers! 💐",
  "Please? I'll buy you pizza! 🍕",
  "Come on, the teddy is crying now! 😭🧸",
  "I'm literally on my knees here! 🧎",
  "My mom already told her friends... 😳",
  "I already changed my relationship status! 💔",
  "The universe will be sad... 🌌😢",
  "Even the floating hearts are judging you! 💗👀",
  "PLEEEEEEASE? I'm begging! 🙏🙏🙏",
  "I'll do the dishes for a month! 🍽️",
  "Fine, TWO months of dishes! 😤",
  "I already reserved a table at... my kitchen! 🍝",
  "The No button is literally running away from you!",
  "This is the saddest day of my life 💀",
  "I'M NOT CRYING, YOU'RE CRYING! 😭😭😭",
  "Okay but why are you still clicking No though? 🤨",
  "The Yes button is getting SO BIG! Can't miss it now! 👀",
  "I WILL FOLLOW YOU TO THE ENDS OF THE EARTH! 🌍",
  "Just click Yes already! My finger hurts! 👆😫"
];

/* Start music on first interaction */
document.body.addEventListener("click", () => {
  music.play().catch(()=>{});
}, { once: true });

/* Dramatic No Button */
noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);
noBtn.addEventListener("click", moveButton);

function moveButton() {
  noCount++;
  
  // Grow Yes button
  yesSize += 10;
  yesBtn.style.fontSize = yesSize + "px";
  yesBtn.style.padding = (12 + noCount * 2) + "px " + (28 + noCount * 3) + "px";
  
  // Shrink No button
  noSize = Math.max(8, noSize - 2);
  noBtn.style.fontSize = noSize + "px";
  noBtn.style.padding = Math.max(4, 12 - noCount) + "px " + Math.max(10, 28 - noCount * 2) + "px";
  
  // Show pleading message
  const messageIndex = Math.min(noCount - 1, pleadingMessages.length - 1);
  pleadingText.textContent = pleadingMessages[messageIndex];
  
  // Move button to random position
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 100);
  noBtn.style.position = "fixed";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
  noBtn.style.transform = "rotate(" + (Math.random()*360) + "deg)";
  
  // Change color randomly
  const colors = ["#ffb3c1", "#ff9999", "#ffccdd", "#ffa6c9"];
  noBtn.style.background = colors[Math.floor(Math.random() * colors.length)];
  
  // Make No button almost disappear after many attempts
  if (noCount > 10) {
    noBtn.style.opacity = Math.max(0.3, 1 - (noCount - 10) * 0.1);
  }
}

/* Yes Button Click */
yesBtn.addEventListener("click", () => {
  document.body.innerHTML = `
    <div style="
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      background:#ff4d6d;
      color:white;
      font-size:30px;
      text-align:center;
      padding: 20px;
      animation: fadeIn 1s ease-in-out;">
      <div style="font-size:100px; margin-bottom: 20px;">🎉💖✨</div>
      <div style="font-size:40px; margin-bottom: 10px;">YAAAY!!!</div>
      <div>I knew you couldn't resist! 😄</div>
      <div style="font-size:20px; margin-top: 20px;">You made me the happiest person alive! 💕</div>
      <div style="font-size:80px; margin-top: 30px;">💍👫💖</div>
      <div style="font-size:18px; margin-top: 20px; opacity: 0.9;">
        ${noCount > 0 ? `(Only took ${noCount} attempts... but who's counting? 😅)` : '(Smart choice on the first try! 🌟)'}
      </div>
    </div>
  `;
});

/* Generate floating hearts */
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 15 + "px";
  heart.style.animationDuration = Math.random() * 3 + 4 + "s";
  document.body.appendChild(heart);
  
  setTimeout(() => {
    heart.remove();
  }, 6000);
}

setInterval(createHeart, 400);
</script>

</body>
</html>
